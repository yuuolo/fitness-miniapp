# 测试环境（体验版 / 开发版专用）
#
# 与正式环境完全隔离：独立 Postgres 容器 + 独立数据卷，媒体也存在测试库里。
# 用法：docker compose -f docker-compose.staging.yml up -d --build
# 对外端口 8081，由外层 nginx 把 https://test-gym.novrein.com 反代到这里
services:
  db-staging:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: gym_staging
    volumes:
      - pgdata_staging:/var/lib/postgresql/data
      - ./server/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gym_staging"]
      interval: 5s
      timeout: 3s
      retries: 12

  server-staging:
    build: ./server
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db-staging:5432/gym_staging
      WX_APPID: ${WX_APPID}
      WX_SECRET: ${WX_SECRET}
      PORT: 3000
      WX_MP_STATE: ${WX_MP_STATE:-developer}
      SHOP_ADDRESS: ${SHOP_ADDRESS:-前台签到}
      # 测试环境的媒体地址：必须指向测试域名，否则体验版里分享出去会指到正式站
      PUBLIC_BASE_URL: ${STAGING_PUBLIC_BASE_URL:-https://gym.novrein.com/test-api}
      # 测试环境用独立管理密码，避免和正式后台混用
      ADMIN_PASSWORD: ${STAGING_ADMIN_PASSWORD:-}
      CONFIG_SECRET: ${CONFIG_SECRET:-}
      # 打开访问日志：排查小程序请求有没有到（正式环境不开）
      ACCESS_LOG: "1"
      # 测试环境不发微信订阅消息（避免打扰真实会员）
      NOTIFY_DISABLED: "1"
      OCR_URL: ${OCR_URL:-}
      OCR_TIMEOUT: ${OCR_TIMEOUT:-20000}
    volumes:
      - ./backups-staging:/app/backups
    depends_on:
      db-staging:
        condition: service_healthy
    ports:
      # 外层 nginx 反代到这里（仅本机与内网可访问，按需改绑定地址）
      - "8081:3000"

volumes:
  pgdata_staging:
