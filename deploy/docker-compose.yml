services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: gym
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gym"]
      interval: 5s
      timeout: 3s
      retries: 12

  server:
    build: ./server
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/gym
      WX_APPID: ${WX_APPID}
      WX_SECRET: ${WX_SECRET}
      PORT: 3000
      # 订阅消息（模板 ID 留空则不发送该类通知）
      WX_TPL_BOOKING_SUCCESS: ${WX_TPL_BOOKING_SUCCESS:-}
      WX_TPL_CLASS_REMINDER: ${WX_TPL_CLASS_REMINDER:-}
      WX_TPL_CARD_EXPIRE: ${WX_TPL_CARD_EXPIRE:-}
      WX_MP_STATE: ${WX_MP_STATE:-developer}
      # 课前提醒里的「场地地址」，按门店实际填写
      SHOP_ADDRESS: ${SHOP_ADDRESS:-前台签到}
      # 上传文件对外地址前缀（小程序要能直接访问）
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://gym.novrein.com}
      # 服务器管理页 /admin 的密码；留空则管理入口关闭
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # 云存储 AccessKey 等敏感配置的加密密钥（换掉会导致已保存的密钥失效）
      CONFIG_SECRET: ${CONFIG_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - server

volumes:
  pgdata:
  caddy_data:
  caddy_config:
