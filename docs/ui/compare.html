<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #ece7e2; font: 14px/1.6 -apple-system, "Microsoft YaHei", sans-serif; padding: 26px; }
  h1 { font-size: 19px; color: #23201d; margin-bottom: 4px; }
  .lead { font-size: 13px; color: #6b645c; margin-bottom: 20px; }
  .wrap { display: flex; gap: 26px; align-items: flex-start; }
  .col { width: 320px; }
  .lab { font-size: 12px; color: #6b645c; margin-bottom: 8px; text-align: center; }
  .phone { border-radius: 20px; padding: 12px; border: 1px solid rgba(0,0,0,.06); }
  .hero { border-radius: 12px; padding: 18px 14px; color: #fff; margin-bottom: 11px; }
  .hello { font-size: 19px; font-weight: 600; }
  .hsub { font-size: 11px; opacity: .9; margin-top: 4px; }
  .card { padding: 12px; margin-bottom: 11px; }
  .t { font-size: 14px; font-weight: 600; }
  .li { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid; font-size: 12px; }
  .li:last-child { border-bottom: 0; }
  .grow { flex: 1; }
  .q { flex: 1; padding: 11px; }
  .tag { font-size: 10px; padding: 1px 6px; border-radius: 6px; }
  .btn { display: inline-flex; align-items: center; height: 26px; padding: 0 13px; border-radius: 999px; color: #fff; font-size: 12px; }
  .btn.ghost { border: 1px solid; }
  .tabbar { display: flex; border-top: 1px solid; border-radius: 0 0 14px 14px; margin: 0 -12px -12px; }
  .tb { flex: 1; text-align: center; padding: 8px 0; font-size: 12px; }
  .tb.on { font-weight: 600; }
  .arrow { text-align: center; font-size: 26px; color: #9c948c; padding-top: 150px; }
</style></head><body>
  <h1>配色改造前后对比</h1>
  <div class="lead">同一套组件，只换颜色与圆角。右边把冷灰底改成暖米底，主色压低饱和，圆角统一。</div>
  <div class="wrap">
    
  <div class="col">
    <div class="lab">改造前：冷灰底 + 荧光橙</div>
    <div class="phone" style="background:#f5f6f8">
      <div class="hero" style="background:linear-gradient(135deg,#ff6a3d,#ff9a5c)">
        <div class="hello">你好，店长</div>
        <div class="hsub">今天也要动起来 · 积分 120</div>
      </div>
      <div class="card" style="background:#fff;border-radius:10px;box-shadow:none">
        <div class="t" style="color:#1f2329">卧推排行榜</div>
        <div class="li" style="border-color:#f0f1f4">
          <span style="color:#8a8f99">1</span><span class="grow" style="color:#1f2329">参赛会员</span>
          <span style="color:#ff6a3d;font-weight:600">143 kg</span>
        </div>
        <div class="li" style="border-color:#f0f1f4">
          <span style="color:#8a8f99">2</span><span class="grow" style="color:#1f2329">会员小明</span>
          <span style="color:#ff6a3d;font-weight:600">121 kg</span>
        </div>
      </div>
      <div style="display:flex;gap:8px">
        <div class="q" style="background:#fff;border-radius:10px;box-shadow:none">
          <div style="color:#1f2329;font-size:13px;font-weight:600">约团课</div>
          <div style="color:#8a8f99;font-size:11px">瑜伽 单车</div>
        </div>
        <div class="q" style="background:#fff;border-radius:10px;box-shadow:none">
          <div style="color:#1f2329;font-size:13px;font-weight:600">健身友圈</div>
          <div style="color:#8a8f99;font-size:11px">晒训练</div>
        </div>
      </div>
      <div style="display:flex;gap:6px;align-items:center;margin-top:9px">
        <span class="tag" style="background:#e8f7ee;color:#1a9a4b">可用</span>
        <span class="tag" style="background:#fdecec;color:#d93a3a">已过期</span>
        <span class="tag" style="background:#f0f1f4;color:#5c6370">普通</span>
      </div>
      <div style="display:flex;gap:7px;margin-top:9px">
        <span class="btn" style="background:#ff6a3d">主要按钮</span>
        <span class="btn ghost" style="color:#ff6a3d;border-color:#fff1eb;background:#fff">次要</span>
      </div>
      <div class="tabbar" style="background:#fff;border-color:#f0f1f4">
        <div class="tb on" style="color:#ff6a3d">首页</div>
        <div class="tb" style="color:#8a8f99">友圈</div>
        <div class="tb" style="color:#8a8f99">我的</div>
      </div>
    </div>
  </div>
    <div class="arrow">→</div>
    
  <div class="col">
    <div class="lab">改造后：暖米底 + 沉稳橙</div>
    <div class="phone" style="background:#f7f4f1">
      <div class="hero" style="background:linear-gradient(135deg,#e9603a,#f18a5f)">
        <div class="hello">你好，店长</div>
        <div class="hsub">今天也要动起来 · 积分 120</div>
      </div>
      <div class="card" style="background:#fff;border-radius:12px;box-shadow:0 2px 10px rgba(35,32,29,.05)">
        <div class="t" style="color:#23201d">卧推排行榜</div>
        <div class="li" style="border-color:#efe8e1">
          <span style="color:#9c948c">1</span><span class="grow" style="color:#23201d">参赛会员</span>
          <span style="color:#e9603a;font-weight:600">143 kg</span>
        </div>
        <div class="li" style="border-color:#efe8e1">
          <span style="color:#9c948c">2</span><span class="grow" style="color:#23201d">会员小明</span>
          <span style="color:#e9603a;font-weight:600">121 kg</span>
        </div>
      </div>
      <div style="display:flex;gap:8px">
        <div class="q" style="background:#fff;border-radius:12px;box-shadow:0 2px 10px rgba(35,32,29,.05)">
          <div style="color:#23201d;font-size:13px;font-weight:600">约团课</div>
          <div style="color:#9c948c;font-size:11px">瑜伽 单车</div>
        </div>
        <div class="q" style="background:#fff;border-radius:12px;box-shadow:0 2px 10px rgba(35,32,29,.05)">
          <div style="color:#23201d;font-size:13px;font-weight:600">健身友圈</div>
          <div style="color:#9c948c;font-size:11px">晒训练</div>
        </div>
      </div>
      <div style="display:flex;gap:6px;align-items:center;margin-top:9px">
        <span class="tag" style="background:#e9f6ef;color:#2e9668">可用</span>
        <span class="tag" style="background:#fceceb;color:#c9433d">已过期</span>
        <span class="tag" style="background:#efe8e1;color:#6b645c">普通</span>
      </div>
      <div style="display:flex;gap:7px;margin-top:9px">
        <span class="btn" style="background:#e9603a">主要按钮</span>
        <span class="btn ghost" style="color:#e9603a;border-color:#fdf0ea;background:#fff">次要</span>
      </div>
      <div class="tabbar" style="background:#fff;border-color:#efe8e1">
        <div class="tb on" style="color:#e9603a">首页</div>
        <div class="tb" style="color:#9c948c">友圈</div>
        <div class="tb" style="color:#9c948c">我的</div>
      </div>
    </div>
  </div>
  </div>
</body></html>
