  .li { display: flex; align-items: center; padding: 13px 0; border-bottom: 1px solid #f5f0ea; font-size: 15px; }
  .li:last-child { border-bottom: 0; }
  .li .ic { margin: 0 14px 0 0; }
  .chev { color: #c3bab1; font-size: 16px; }
  .grow { flex: 1; }
